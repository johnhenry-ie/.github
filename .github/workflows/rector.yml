name: Rector

on:
  workflow_call:
    inputs:
      php_version:
        type: string
        default: "8.2"
    secrets:
      token:
        required: false

jobs:
  rector:
    name: Rector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          coverage: none
          extensions: ctype,curl,dom,iconv,imagick,intl,json,mbstring,openssl,pcre,pdo,reflection,spl,zip
          ini-values: post_max_size=256M, max_execution_time=180, memory_limit=512M
          ini-file: development
          tools: composer:v2
        env:
          COMPOSER_TOKEN: ${{ secrets.token }}


      - name: Composer cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-php-${{ inputs.php_version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ inputs.php_version }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-ansi --no-progress --prefer-dist

      - name: Run Rector (dry run)
        run: |
          if [ -f vendor/bin/rector ]; then
            vendor/bin/rector process --dry-run --ansi
          else
            echo "Skipping Rector (vendor/bin/rector missing)."
          fi
