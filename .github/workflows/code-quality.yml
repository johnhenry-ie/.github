name: Code Quality

on:
  workflow_call:
    inputs:
      php_version:
        default: '8.2'
        type: string
      node_version:
        default: '24'
        type: string
      jobs:
        default: '["ecs"]'
        type: string
      src_path:
        required: false
        type: string
        default: 'src'
    secrets:
      token:
        required: false
jobs:
  ecs:
    name: ECS
    if: ${{ contains(fromJSON(inputs.jobs), 'ecs') }}
    uses: ./.github/workflows/ecs.yml
    secrets:
      token: ${{ secrets.token }}
    with:
      php_version: ${{ inputs.php_version }}
      src_path: ${{ inputs.src_path }}

  phpstan:
    name: PHPStan
    if: ${{ contains(fromJSON(inputs.jobs), 'phpstan') }}
    uses: ./.github/workflows/phpstan.yml
    secrets:
      token: ${{ secrets.token }}
    with:
      php_version: ${{ inputs.php_version }}
      src_path: ${{ inputs.src_path }}

  prettier:
    name: Prettier
    if: ${{ contains(fromJSON(inputs.jobs), 'prettier') }}
    uses: ./.github/workflows/prettier.yml
    with:
      node_version: ${{ inputs.node_version }}

  eslint:
    name: ESLint
    if: ${{ contains(fromJSON(inputs.jobs), 'eslint') }}
    uses: ./.github/workflows/eslint.yml
    with:
      node_version: ${{ inputs.node_version }}
      src_path: ${{ inputs.src_path }}

  rector:
    name: Rector
    if: ${{ contains(fromJSON(inputs.jobs), 'rector') }}
    uses: ./.github/workflows/rector.yml
    secrets:
      token: ${{ secrets.token }}
