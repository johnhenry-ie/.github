name: Plugins

on:
  workflow_call:
    secrets:
      token:
        required: false
    inputs:
      craft_version:
        default: '4'
        type: string
      php_version:
        default: '8.2'
        type: string
      node_version:
        default: '24'
        type: string
      jobs:
        default: '["ecs"]'
        type: string

concurrency:
  group: ci-global-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality
    if: ${{ contains(fromJSON(inputs.jobs), 'ecs') || contains(fromJSON(inputs.jobs), 'phpstan') || contains(fromJSON(inputs.jobs), 'prettier') || contains(fromJSON(inputs.jobs), 'eslint') || contains(fromJSON(inputs.jobs), 'rector') }}
    uses: ./.github/workflows/code-quality.yml
    secrets:
      token: ${{ secrets.token }}
    with:
      php_version: ${{ fromJSON('{"3":"8.2","4":"8.2","5":"8.2"}')[inputs.craft_version] || inputs.php_version }}
      jobs: ${{ inputs.jobs }}
      node_version: ${{ inputs.node_version }}
